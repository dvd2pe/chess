name: Extract uploaded project archive
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/extract-project.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          archive="www.crazygames.com.zip"
          test -f "$archive"
          mkdir -p /tmp/project
          unzip -q "$archive" -d /tmp/project
          echo "Extracted files: $(find /tmp/project -type f | wc -l)"
          du -sh /tmp/project
          mkdir -p audit-extracted
          cp -a /tmp/project/. audit-extracted/
          find audit-extracted -type f | sort > /tmp/file-list.txt
          cp /tmp/file-list.txt audit-extracted/FILE-MANIFEST.txt
      - name: Commit extracted source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-extracted
          git commit -m "Extract uploaded project archive for audit" || exit 0
          git push
